name: longmarch

# 说明（上传目录持久化 / #18）：
#   后端静态上传目录由 backend 配置项 UPLOAD_ROOT 指定（默认 backend/uploads），
#   /uploads 静态服务与用户/人物头像均落此目录。若后端以容器方式部署，务必为
#   UPLOAD_ROOT 挂载持久化卷（named volume 或宿主机 bind mount），否则容器重建
#   会丢失已上传头像；同时确保 UPLOAD_ROOT 指向独立子目录而非项目根（后端启动时
#   _assert_upload_layout 会断言其不含 .env、不是项目根）。示例（按需加入 backend 服务）：
#     volumes:
#       - longmarch-uploads:/app/backend/uploads   # 与 UPLOAD_ROOT 一致
#   本 compose 当前仅编排数据库与初始化，故此处只作注释说明，不改动服务结构。

services:
  opengauss:
    image: opengauss/opengauss-server:latest
    container_name: longmarch-opengauss
    privileged: true
    restart: unless-stopped
    environment:
      GS_NODENAME: longmarch
      GS_USERNAME: gaussdb
      GS_PASSWORD: "LongMarch@123"
      GS_PORT: "5118"
    ports:
      - "5118:5118"
    volumes:
      - opengauss-data:/var/lib/opengauss
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          LD_LIBRARY_PATH=/usr/local/opengauss/lib /usr/local/opengauss/bin/gsql
          -h 127.0.0.1 -p 5118 -U gaussdb -W "$$GS_PASSWORD"
          -d postgres -t -A -c "SELECT 1" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  database-init:
    image: opengauss/opengauss-server:latest
    restart: "no"
    depends_on:
      opengauss:
        condition: service_healthy
    environment:
      GS_HOST: opengauss
      GS_PORT: "5118"
      GS_USERNAME: gaussdb
      GS_PASSWORD: "LongMarch@123"
      GS_DATABASE: longmarch
    entrypoint: ["/bin/bash", "/docker/init/init-db.sh"]
    volumes:
      - ./init:/docker/init:ro

volumes:
  opengauss-data:
